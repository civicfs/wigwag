name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'civicfs/wigwag' && startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Validate requested tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag on main
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check package identity and OIDC-capable npm
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== '@civicfs/wigwag' || process.env.RELEASE_TAG !== `v${pkg.version}`)
            throw new Error('Release tag must match the Wigwag package version');
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))))
            throw new Error('npm 11.5.1 or newer is required for trusted publishing');
          JS
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint:check
      - run: npm test
      - run: npm run check:public -- --history
      - run: npm run check:package
      - run: npm audit --omit=dev --audit-level=low
      - name: Require an unchanged tracked tree
        run: git diff --exit-code HEAD
      - name: Publish using npm trusted publishing
        run: npm publish --access public
