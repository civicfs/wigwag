name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint:check
      - name: Unit and upgrade lifecycle tests
        run: npm test
      - run: npm run check:public -- --history
      - run: npm run check:package
      - run: npm audit --omit=dev --audit-level=low

  required:
    name: CI required
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every matrix entry to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          if [[ "$VERIFY_RESULT" != success ]]; then
            printf 'Matrix verification did not succeed: %s\n' "$VERIFY_RESULT" >&2
            exit 1
          fi
