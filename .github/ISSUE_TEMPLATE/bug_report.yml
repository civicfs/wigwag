name: Bug report
description: Report a reproducible problem with synthetic or redacted evidence.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md instead of posting exploit details here.
        Do not attach databases, transcripts, credentials, or unredacted logs.
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      description: Wigwag, Node, operating system, and affected provider CLI versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps using synthetic session names, paths, and messages.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted diagnostics
      description: Relevant doctor/delivery output or a minimal screenshot. Remove private data first.
